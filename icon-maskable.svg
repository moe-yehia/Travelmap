<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1d24"/>
      <stop offset="1" stop-color="#0e1014"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so safe area (80% inner) still looks intentional -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Route + dots scaled to 60% so they sit inside the maskable safe zone -->
  <g transform="translate(102 102) scale(0.6)">
    <path d="M120 380 Q200 280 256 300 T392 140"
          fill="none" stroke="url(#route)" stroke-width="48"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="120" cy="380" r="42" fill="#3fb950" stroke="#fff" stroke-width="8"/>
    <circle cx="392" cy="140" r="42" fill="#f04a4a" stroke="#fff" stroke-width="8"/>
    <circle cx="256" cy="300" r="30" fill="#4f8cff" stroke="#fff" stroke-width="7"/>
  </g>
</svg>
